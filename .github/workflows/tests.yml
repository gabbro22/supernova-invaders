# Tests on GitHub's Windows runners, so no test run uses Tim's PC. One file, three modes:
#
# - Inline (no repo variables set, the repo is public): the test job runs right here.
# - Private source (variable TEST_RUNNER_REPO set): no job runs here, so no PR check needs the
#   private repo's billed Actions minutes. tools\test-dispatch.ps1 (a scheduled task on the PC,
#   orchestrator/orch/test_dispatch.py) starts each PR head and main push on the public runner
#   repo, which runs this same file. A tools\test.ps1 run of a PR head reports to that PR itself.
# - Runner (the public runner repo, variable TEST_SOURCE_REPO set): checks out the private repo
#   with secret SOURCE_TOKEN, prints only the suite PASS/FAIL lines, seals the full log with the
#   public key in variable TEST_LOG_PUBLIC_KEY (tools\test_seal.ps1) and uploads only the sealed
#   file. Only workflow_dispatch and the nightly schedule run there. Never add pull_request_target
#   to this file: it would hand the secrets to fork PRs.
#
# Jobs: plan works out the suites (tools\test.ps1 -ListSuites, the same selection a PC run makes),
# test runs each suite on its own runner, and report joins their lines into one PR comment and one
# test-report-<run id> artifact (summary.txt plus each suite's report).
#
# What runs:
# - A ready PR into main: tools\test.ps1 -Changed on the PR head, then one `orch-tests: pass|fail`
#   comment with a `Tested: <sha>` line on the PR. The merge gate (orchestrator/orch/merge_gate.py)
#   reads it.
# - A push to main: the full run with -NoCache.
# - Nightly at 01:00 UTC: the full run with -NoCache (in the runner repo once it exists).
# - tools\test.ps1 on a PC: it pushes a test-run/<id> branch and dispatches this workflow with its
#   switches in test_args (tools\test_cloud.ps1). tools\setup-test-runner.ps1 sets up the runner.
#
# PRs from forks never run: only branches in the source repo do.
name: tests
run-name: ${{ inputs.run_key || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      test_args:
        description: 'tools\test.ps1 switches (empty: the full run with -NoCache)'
        required: false
        default: ''
      ref:
        description: 'Source commit or branch to test (runner mode)'
        required: false
        default: ''
      pr:
        description: 'Source PR number that gets the orch-tests comment'
        required: false
        default: ''
      run_key:
        description: 'Run name, so the caller can find this run'
        required: false
        default: ''

permissions:
  contents: read

# A newer PR push replaces the PR's running check. A push to main never cancels the running full
# run: the newest main push waits in the queue (GitHub keeps one pending run per group) and runs
# next, so every full run finishes and the latest main is always tested.
concurrency:
  group: tests-${{ inputs.pr || github.event.pull_request.number || inputs.run_key || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  # Only a newer push to the same PR cancels (directly, or handed to the runner with a pr input);
  # a full run on main is never cut short by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr != '' }}

jobs:
  plan:
    if: >-
      (vars.TEST_SOURCE_REPO != '' &&
       (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) ||
      (vars.TEST_SOURCE_REPO == '' && vars.TEST_RUNNER_REPO == '' &&
       (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         !github.event.pull_request.draft)))
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      args: ${{ steps.plan.outputs.args }}
    env:
      AUTOMATOES_ALLOW_LOCAL: '1'
      AUTOMATOES_NO_ELEVATE: '1'
      PYTHONUTF8: '1'
      QUIET: ${{ vars.TEST_SOURCE_REPO != '' && '1' || '' }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TEST_SOURCE_REPO || github.repository }}
          token: ${{ vars.TEST_SOURCE_REPO != '' && secrets.SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || (vars.TEST_SOURCE_REPO != '' && 'main') || github.sha }}
          # Only the tested commit: a full fetch prints every branch name of the source in the log.
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch main for -Changed
        # The history of the tested commit and origin/main (the merge base -Changed diffs against),
        # quietly, so no ref names reach the log.
        run: |
          $ErrorActionPreference = 'Continue'
          git fetch --quiet --no-tags --unshallow origin "+refs/heads/main:refs/remotes/origin/main" *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host 'Fetching main failed'; exit 1 }

      - name: Plan
        id: plan
        env:
          TEST_ARGS: ${{ inputs.test_args }}
        run: |
          $ErrorActionPreference = 'Continue'
          $requested = @("$env:TEST_ARGS" -split '\s+' | Where-Object { $_ })
          if ('${{ github.event_name }}' -eq 'pull_request') { $runArgs = @('-Changed') }
          elseif ($requested.Count -gt 0) {
            # Sent by tools\test.ps1 (tools\test_cloud.ps1) or tools\test-dispatch.ps1: switches and suite lists only.
            $bad = @($requested | Where-Object { $_ -notmatch '^-?[A-Za-z][A-Za-z0-9,-]*$' })
            if ($bad.Count) { Write-Host "Refused test_args: $($bad -join ' ')"; exit 1 }
            $runArgs = $requested
          }
          else { $runArgs = @('-NoCache') }
          # Each test job adds its own -Only, so a requested -Only only narrows the plan.
          $jobArgs = @()
          for ($i = 0; $i -lt $runArgs.Count; $i++) {
            if ($runArgs[$i] -ieq '-Only') { $i++; continue }
            $jobArgs += $runArgs[$i]
          }
          $out = @(& powershell -ExecutionPolicy Bypass -File tools\test.ps1 -Local -ListSuites @runArgs *>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          # Runner mode: the selection prints changed paths, so only the suite list reaches the log.
          if (-not $env:QUIET) { $out | ForEach-Object { Write-Host $_ } }
          if ($code -ne 0) { Write-Host "Planning failed (exit $code)"; exit 1 }
          $line = @($out | Where-Object { $_ -match '^SUITES=' }) | Select-Object -Last 1
          $suites = @()
          if ($line) { $suites = @(($line -replace '^SUITES=', '') -split ',' | Where-Object { $_ }) }
          Write-Host "Suites: $(if ($suites.Count) { $suites -join ', ' } else { 'none' })"
          "suites=$(ConvertTo-Json -InputObject @($suites) -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "args=$($jobArgs -join ' ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  test:
    needs: plan
    if: needs.plan.outputs.suites != '' && needs.plan.outputs.suites != '[]'
    name: test (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # One suite per runner: nothing else runs here.
      AUTOMATOES_ALLOW_LOCAL: '1'
      AUTOMATOES_NO_ELEVATE: '1'
      PYTHONUTF8: '1'
      # Runner mode: nothing from the source may reach the public log.
      QUIET: ${{ vars.TEST_SOURCE_REPO != '' && '1' || '' }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TEST_SOURCE_REPO || github.repository }}
          token: ${{ vars.TEST_SOURCE_REPO != '' && secrets.SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || (vars.TEST_SOURCE_REPO != '' && 'main') || github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch main for -Changed
        run: |
          $ErrorActionPreference = 'Continue'
          git fetch --quiet --no-tags --unshallow origin "+refs/heads/main:refs/remotes/origin/main" *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host 'Fetching main failed'; exit 1 }

      # The runner image has no Python 3.10, so setup-python downloaded it on every run (about 45s).
      - name: Cache Python
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/Python/3.10.11
          key: python-${{ runner.os }}-3.10.11

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - uses: actions/setup-go@v5
        with:
          go-version-file: remote/agent/go.mod
          cache-dependency-path: remote/agent/go.sum

      - name: Cache the shared venvs
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Automatoes\venvs
          key: venvs-${{ runner.os }}-py310-${{ hashFiles('gui/pyproject.toml', 'ocr/pyproject.toml', 'orchestrator/requirements*.txt', 'tools/setup.ps1') }}
          restore-keys: venvs-${{ runner.os }}-py310-

      # A pinned AutoHotkey, cached: no release lookup against the API limit the runner IPs share.
      - name: Cache AutoHotkey
        id: ahk-cache
        uses: actions/cache@v4
        with:
          path: .build/ahk
          key: ahk-v2.0.31

      - name: AutoHotkey v2 (portable)
        if: steps.ahk-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .build\ahk | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip' -OutFile .build\AutoHotkey.zip -UseBasicParsing
          Expand-Archive -LiteralPath .build\AutoHotkey.zip -DestinationPath .build\ahk -Force
          Get-ChildItem .build\ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1 -ExpandProperty FullName

      - name: Setup
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:QUIET) {
            & powershell -ExecutionPolicy Bypass -File tools\setup.ps1 *> "$env:RUNNER_TEMP\setup.log"
            $code = $LASTEXITCODE
            Write-Host "setup exit $code (output sealed)"
            exit $code
          }
          & powershell -ExecutionPolicy Bypass -File tools\setup.ps1
          exit $LASTEXITCODE

      - name: Test
        id: test
        env:
          JOB_ARGS: ${{ needs.plan.outputs.args }}
          SUITE: ${{ matrix.suite }}
        run: |
          # GitHub's powershell shell sets Stop, and 2>&1 turns any stderr line of the run (a
          # faulthandler dump, a warning) into a terminating error that kills the whole run.
          $ErrorActionPreference = 'Continue'
          $testArgs = @('-ExecutionPolicy', 'Bypass', '-File', 'tools\test.ps1', '-Local')
          $testArgs += @("$env:JOB_ARGS" -split '\s+' | Where-Object { $_ })
          $testArgs += @('-Only', $env:SUITE)
          $log = "$env:RUNNER_TEMP\test.log"
          if ($env:QUIET) {
            & powershell @testArgs *> $log
            $code = $LASTEXITCODE
          } else {
            & powershell @testArgs 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
          }
          # This suite's lines (ocr has two) without the run total; the report job joins them.
          $lines = @()
          if (Test-Path $log) { $lines = @(Get-Content $log | Where-Object { $_ -match '^\s+\S+\s+(PASS|FAIL)\b' -and $_ -notmatch '^\s+total\s' }) }
          if ($env:QUIET) { $lines | ForEach-Object { Write-Host $_ } }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\summary" | Out-Null
          [IO.File]::WriteAllLines("$env:RUNNER_TEMP\summary\$env:SUITE.txt", [string[]]$lines)
          exit $code

      - name: Keep the suite lines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.suite }}
          path: ${{ runner.temp }}/summary/
          retention-days: 1
          if-no-files-found: ignore

      - name: Seal the test reports
        if: always() && env.QUIET == '1'
        env:
          LOG_PUBLIC_KEY: ${{ vars.TEST_LOG_PUBLIC_KEY }}
          SUITE: ${{ matrix.suite }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "$env:RUNNER_TEMP\report"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($f in @("$env:RUNNER_TEMP\test.log", "$env:RUNNER_TEMP\setup.log")) {
            if (Test-Path $f) { Copy-Item $f $stage }
          }
          if (Test-Path report\test-runs) { Copy-Item report\test-runs "$stage\test-runs" -Recurse }
          $zip = "$env:RUNNER_TEMP\report.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\sealed" | Out-Null
          . .\tools\test_seal.ps1
          Protect-TestFile -InFile $zip -OutFile "$env:RUNNER_TEMP\sealed\$env:SUITE.sealed" -PublicKeyXml $env:LOG_PUBLIC_KEY
          Remove-Item $zip, $stage -Recurse -Force

      - name: Keep the sealed test reports
        if: always() && env.QUIET == '1'
        uses: actions/upload-artifact@v4
        with:
          name: sealed-${{ matrix.suite }}
          path: ${{ runner.temp }}/sealed/
          retention-days: 1
          if-no-files-found: ignore

      - name: Keep the test reports
        if: always() && env.QUIET != '1'
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.suite }}
          path: |
            report/test-runs/*.md
            report/test-runs/junit/
            ${{ runner.temp }}/test.log
          retention-days: 1
          if-no-files-found: ignore

  report:
    needs: [plan, test]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      QUIET: ${{ vars.TEST_SOURCE_REPO != '' && '1' || '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: summary-*
          path: summary
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ vars.TEST_SOURCE_REPO != '' && 'sealed-*' || 'report-*' }}
          path: report
          merge-multiple: ${{ vars.TEST_SOURCE_REPO != '' }}

      - name: Join the suite lines
        id: summary
        env:
          SUITES: ${{ needs.plan.outputs.suites }}
          PLAN: ${{ needs.plan.result }}
        run: |
          $suites = @()
          if ($env:SUITES) { $suites = @($env:SUITES | ConvertFrom-Json) }
          $lines = @()
          $seconds = 0.0
          foreach ($suite in $suites) {
            $file = "summary/$suite.txt"
            $got = @()
            if (Test-Path $file) { $got = @(Get-Content $file | Where-Object { $_.Trim() }) }
            # A job that ended before its summary (a crash, a timeout, a cancel) still counts.
            if (-not $got.Count) { $got = @(('  {0,-11} FAIL {1,8}' -f $suite, 'no result')) }
            foreach ($line in $got) {
              $lines += $line
              $m = [regex]::Match($line, '([\d,]+(?:\.\d+)?)s\s*$')
              if ($m.Success) { $seconds += [double]($m.Groups[1].Value -replace ',', '') }
            }
          }
          # The total is suite time added up; the jobs ran side by side, so the run took less.
          if ($lines.Count) { $lines += ('  {0,-11} {1,14}' -f 'total', ('{0:N1}s' -f $seconds)) }
          New-Item -ItemType Directory -Force -Path report | Out-Null
          [IO.File]::WriteAllLines("$PWD/report/summary.txt", [string[]]$lines)
          $lines | ForEach-Object { Write-Host $_ }
          $failed = @($lines | Where-Object { $_ -match '\sFAIL\b' })
          $ok = $env:PLAN -eq 'success' -and $failed.Count -eq 0
          "ok=$($ok.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # A run a newer push cancelled says nothing: its "no result" lines are not a failure.
      - name: Report to the PR
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || inputs.pr != '') }}
        env:
          GH_TOKEN: ${{ vars.TEST_SOURCE_REPO != '' && secrets.SOURCE_TOKEN || github.token }}
          REPO: ${{ vars.TEST_SOURCE_REPO || github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || inputs.ref }}
          OK: ${{ steps.summary.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $lines = @()
          if (Test-Path report/summary.txt) { $lines = @(Get-Content report/summary.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ }) }
          $failed = @($lines | Where-Object { $_ -match '\sFAIL\b' } | ForEach-Object { ($_ -split '\s+')[0] })
          if ($env:OK -eq 'true') {
            $head = 'orch-tests: pass ' + (($lines | Where-Object { $_ -match '^total' }) -join ' ')
          } else {
            $why = if ($failed.Count) { 'failed suites: ' + ($failed -join ', ') } else { 'the run did not finish, see the log' }
            $head = "orch-tests: fail $why"
          }
          $body = (@($head, '', "Tested: $env:SHA", '', '```') + $lines + @('```', '', "Log: $env:RUN_URL")) -join "`n"
          $file = "$env:RUNNER_TEMP/comment.md"
          [IO.File]::WriteAllText($file, $body, (New-Object Text.UTF8Encoding $false))
          gh pr comment $env:PR --repo $env:REPO --body-file $file

      # One artifact per run: summary.txt plus each suite's report (sealed in runner mode), which
      # tools\test_cloud.ps1 downloads.
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail on a failed suite
        if: always() && steps.summary.outputs.ok != 'true'
        run: exit 1
