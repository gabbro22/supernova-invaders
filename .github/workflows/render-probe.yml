name: render-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Shot helper
        shell: pwsh
        run: |
          @'
          param([string]$Path)
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($Path)
            "shot $Path $($b.Width)x$($b.Height)"
          } catch { "shot failed: $_" }
          '@ | Set-Content shot.ps1
      - name: Machine
        shell: pwsh
        run: |
          query session
          whoami
          Get-CimInstance Win32_VideoController | Format-List Name, VideoModeDescription, AdapterRAM
          Get-CimInstance Win32_ComputerSystem | Format-List NumberOfLogicalProcessors, TotalPhysicalMemory, Model, Manufacturer
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          New-Item -ItemType Directory shots | Out-Null
          ./shot.ps1 shots/0-desktop.png
      - name: Install
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.roblox.com/download/client?os=win' -OutFile inst.exe -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          (Get-Item inst.exe).Length
          $p = Start-Process inst.exe -PassThru
          $t = 0
          while (-not (Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions", "${env:ProgramFiles(x86)}\Roblox\Versions", "$env:ProgramFiles\Roblox\Versions" -Recurse -Filter RobloxPlayerBeta.exe -ErrorAction SilentlyContinue) -and $t -lt 180) { Start-Sleep 5; $t += 5 }
          Start-Sleep 20
          ./shot.ps1 shots/1-after-install.png
          (Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions", "${env:ProgramFiles(x86)}\Roblox\Versions", "$env:ProgramFiles\Roblox\Versions" -Recurse -Filter RobloxPlayerBeta.exe -ErrorAction SilentlyContinue) | Select-Object FullName
          Get-Process | Where-Object { $_.Name -like 'Roblox*' } | Format-Table Name, Id, WS, MainWindowTitle
      - name: Join lobby
        shell: pwsh
        env:
          COOKIE: ${{ secrets.PROBE_ACCOUNT_COOKIE }}
          PLACE: '8304191830'
        run: |
          Get-Process | Where-Object { $_.Name -like 'Roblox*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          @'
          import os, time, urllib.request, urllib.error
          from urllib.parse import quote
          ck = os.environ["COOKIE"].strip()
          def post(csrf):
              h = {"Cookie": ".ROBLOSECURITY=" + ck, "Referer": "https://www.roblox.com/", "Origin": "https://www.roblox.com",
                   "Content-Type": "application/json", "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
              if csrf: h["X-CSRF-TOKEN"] = csrf
              r = urllib.request.Request("https://auth.roblox.com/v1/authentication-ticket", data=b"{}", headers=h, method="POST")
              try:
                  with urllib.request.urlopen(r, timeout=20) as a: return a.status, a.headers
              except urllib.error.HTTPError as e: return e.code, e.headers
          st, hd = post("")
          if st == 403 and hd.get("x-csrf-token"): st, hd = post(hd["x-csrf-token"])
          t = hd.get("rbx-authentication-ticket") or ""
          print("ticket status", st, "got ticket" if t else "NO TICKET")
          if not t: raise SystemExit(1)
          place = os.environ["PLACE"]
          launcher = quote(f"https://assetgame.roblox.com/game/PlaceLauncher.ashx?request=RequestGame&placeId={place}&isPlayTogetherGame=false", safe="")
          uri = ("roblox-player:1+launchmode:play+gameinfo:" + t + f"+launchtime:{time.time_ns()//1000000}+placelauncherurl:" + launcher
                 + "+browsertrackerid:0+robloxLocale:en_us+gameLocale:en_us")
          os.startfile(uri)
          print("launched")
          '@ | Set-Content join.py
          python join.py
      - name: Watch 10 minutes
        shell: pwsh
        run: |
          $cores = [Environment]::ProcessorCount
          foreach ($i in 1..20) {
            Start-Sleep 30
            ./shot.ps1 ("shots/2-run-{0:d2}.png" -f $i)
            $cpu = (Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average
            $free = [int]((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1KB)
            "t=$($i*30)s machine cpu=$cpu% free=${free}MB"
            Get-Process | Where-Object { $_.Name -like 'Roblox*' } | ForEach-Object { "  $($_.Name) mem=$([int]($_.WS/1MB))MB cpu_s=$([int]$_.CPU) title='$($_.MainWindowTitle)'" }
          }
      - name: Game log lines
        if: always()
        shell: pwsh
        run: |
          $log = Get-ChildItem "$env:LOCALAPPDATA\Roblox\logs\*Player*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $log) { 'no player log'; exit 0 }
          Select-String $log.FullName -Pattern 'graphics|d3d|direct3d|render|fps|hyperion|virtual|joined|joining|disconnect|kick|error|crash' |
            Where-Object { $_.Line -notmatch 'ticket|gameinfo|ROBLOSECURITY|cookie' } | Select-Object -First 60 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(220, $_.Line.Length)) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
